# n8n (SQLite) behind Caddy (automatic HTTPS). One small VPS, two containers.
# Usage on the server, in the directory holding this file and .env:
#   docker compose up -d
# Upgrades are deliberate: change N8N_VERSION in .env, back up, then up -d.

name: n8n-assistant

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:?set N8N_VERSION in .env}
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Europe/Prague
      TZ: Europe/Prague
      # Generated once and kept in the backup: without it stored credentials are unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      # Keep the SQLite database small.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      # Public API is used by scripts/deploy.mjs and scripts/export.mjs.
      N8N_PUBLIC_API_DISABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Code nodes get config from the build and secrets from credentials,
      # so environment access from nodes stays blocked (n8n 2.x default).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    # Not published: only Caddy reaches n8n, over the compose network.
    expose:
      - "5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:${CADDY_VERSION:-2.11.7-alpine}
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"      # ACME HTTP challenge and redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
